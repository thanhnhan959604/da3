{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Lỗi - PlayMood{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <div class="auth-bg"></div>
  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-xl);">
    {% block content %}
    <div class="text-center fade-in">
      <h1 style="font-size:4rem;color:var(--accent-primary);margin-bottom:var(--space-lg);">😔</h1>
      <h2 style="margin-bottom:var(--space-md);">Đã xảy ra lỗi</h2>
      <p style="color:var(--text-secondary);margin-bottom:var(--space-xl);">Vui lòng thử lại sau hoặc liên hệ hỗ trợ.</p>
      <a href="{% url 'home' %}" class="pm-btn pm-btn-primary">Về trang chủ</a>
    </div>
    {% endblock %}
  </main>
</body>
</html>
