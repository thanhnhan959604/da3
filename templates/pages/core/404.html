{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy | PlayMood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <div class="auth-bg"></div>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-xl);text-align:center;">
    <div class="fade-in" style="max-width:500px;">
      <!-- Animated 404 -->
      <div style="font-size:8rem;font-family:var(--font-primary);font-weight:700;color:var(--accent-primary);line-height:1;margin-bottom:var(--space-lg);opacity:0.8;">
        4<span style="display:inline-block;animation:pulseGentle 2s ease-in-out infinite;">🎵</span>4
      </div>
      
      <h1 style="font-family:var(--font-primary);font-size:var(--fs-h2);margin-bottom:var(--space-md);color:var(--text-primary);">
        Oops! Trang không tồn tại
      </h1>
      
      <p style="color:var(--text-secondary);font-size:var(--fs-body-lg);margin-bottom:var(--space-xl);max-width:400px;margin-left:auto;margin-right:auto;">
        Có vẻ như bạn đã lạc đường. Không sao, hãy quay lại trang chủ và tiếp tục hành trình âm nhạc nhé! 🌿
      </p>

      <div style="display:flex;gap:var(--space-md);justify-content:center;flex-wrap:wrap;">
        <a href="{% url 'home' %}" class="pm-btn pm-btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Về trang chủ
        </a>
        <a href="{% url 'explore' %}" class="pm-btn pm-btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Khám phá nhạc
        </a>
      </div>
    </div>
  </div>
</body>
</html>
