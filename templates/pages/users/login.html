{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập vào PlayMood - Nền tảng nghe nhạc theo tâm trạng">
  <title>Đăng nhập - PlayMood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <!-- Animated Background -->
  <div class="auth-bg"></div>

  <div class="auth-page">
    <div class="auth-card fade-in">
      <!-- Logo -->
      <a href="{% url 'home' %}" class="auth-logo">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <span class="auth-logo-text">Play<span>Mood</span></span>
      </a>

      <h1 class="auth-title">Chào mừng trở lại</h1>
      <p class="auth-subtitle">Đăng nhập để tiếp tục hành trình âm nhạc</p>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm" novalidate>
        <div class="auth-form-group">
          <label class="auth-form-label" for="loginEmail">Email</label>
          <input type="email" class="pm-input" id="loginEmail" placeholder="you@example.com" required>
          <span class="pm-input-error" id="emailError" style="display:none;"></span>
        </div>

        <div class="auth-form-group">
          <div class="auth-form-row">
            <label class="auth-form-label" for="loginPassword">Mật khẩu</label>
            <a href="#" class="auth-form-link">Quên mật khẩu?</a>
          </div>
          <input type="password" class="pm-input" id="loginPassword" placeholder="Nhập mật khẩu" required>
          <span class="pm-input-error" id="passwordError" style="display:none;"></span>
        </div>

        <label class="pm-check">
          <input type="checkbox" checked>
          <span class="pm-check-label">Ghi nhớ đăng nhập</span>
        </label>

        <button type="submit" class="pm-btn pm-btn-primary auth-submit-btn" id="loginSubmitBtn">
          Đăng nhập
        </button>
      </form>

      {% comment %} <!-- Divider -->
      <div class="auth-divider">hoặc tiếp tục với</div>

      <!-- Social Buttons -->
      <div class="auth-social-btns">
        <button class="auth-social-btn" id="googleLoginBtn">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="auth-social-btn" id="facebookLoginBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div> {% endcomment %}

      <!-- Footer -->
      <div class="auth-footer">
        Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail');
      const password = document.getElementById('loginPassword');
      const emailError = document.getElementById('emailError');
      const passwordError = document.getElementById('passwordError');
      let valid = true;

      // Reset
      emailError.style.display = 'none';
      passwordError.style.display = 'none';
      email.classList.remove('is-error');
      password.classList.remove('is-error');

      // Email validation
      if (!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
        emailError.textContent = 'Vui lòng nhập email hợp lệ';
        emailError.style.display = 'block';
        email.classList.add('is-error');
        valid = false;
      }

      // Password validation
      if (!password.value || password.value.length < 6) {
        passwordError.textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
        passwordError.style.display = 'block';
        password.classList.add('is-error');
        valid = false;
      }

      if (valid) {
        const btn = document.getElementById('loginSubmitBtn');
        btn.textContent = 'Đang đăng nhập...';
        btn.disabled = true;
        setTimeout(() => {
          window.location.href = '/';
        }, 1500);
      }
    });
  </script>
</body>
</html>
