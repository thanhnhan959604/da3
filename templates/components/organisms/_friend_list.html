{% load static %}
<!-- ===== PlayMood Friend Activity ===== -->
<div class="friend-activity-panel">
  <div class="friend-activity-header">
    <h3 class="friend-activity-title">Hoạt động bạn bè</h3>
    <div style="display:flex;align-items:center;gap:var(--space-xs);">
      <span class="friend-activity-count">3 online</span>
      <button class="pm-btn-icon" id="searchFriendByEmailBtn" title="Tìm bạn qua email" style="width:28px;height:28px;"
              onclick="if(typeof openEmailSearchModal==='function') openEmailSearchModal();">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="friend-list" id="friendList">

    <!-- Friend 1 - Online -->
    <div class="friend-item" id="friend1">
      <div class="friend-avatar-wrap">
        <img class="friend-avatar" src="https://i.pravatar.cc/150?u=user1" alt="Minh Anh">
        <span class="friend-status-dot online"></span>
      </div>
      <div class="friend-info">
        <div class="friend-name-row">
          <div class="friend-name">Minh Anh</div>
          <button class="follow-btn follow-btn-xs following" data-following="true" data-user-id="1"
                  onclick="this.classList.toggle('following');this.textContent=this.classList.contains('following')?'Đang theo dõi':'Theo dõi';">
            Đang theo dõi
          </button>
        </div>
        <div class="friend-listening">
          <div class="equalizer">
            <span class="equalizer-bar"></span>
            <span class="equalizer-bar"></span>
            <span class="equalizer-bar"></span>
          </div>
          <span class="friend-listening-track">See Tình - Hoàng Thùy Linh</span>
        </div>
        <div class="friend-time">2 phút trước</div>
      </div>
    </div>

    <!-- Friend 2 - Online -->
    <div class="friend-item" id="friend2">
      <div class="friend-avatar-wrap">
        <img class="friend-avatar" src="https://i.pravatar.cc/150?u=user2" alt="Hải Đăng">
        <span class="friend-status-dot online"></span>
      </div>
      <div class="friend-info">
        <div class="friend-name-row">
          <div class="friend-name">Hải Đăng</div>
          <button class="follow-btn follow-btn-xs" data-following="false" data-user-id="2"
                  onclick="this.classList.toggle('following');this.textContent=this.classList.contains('following')?'Đang theo dõi':'Theo dõi';">
            Theo dõi
          </button>
        </div>
        <div class="friend-listening">
          <div class="equalizer">
            <span class="equalizer-bar"></span>
            <span class="equalizer-bar"></span>
            <span class="equalizer-bar"></span>
          </div>
          <span class="friend-listening-track">Blinding Lights - The Weeknd</span>
        </div>
        <div class="friend-time">5 phút trước</div>
      </div>
    </div>

    <!-- Friend 3 - Online -->
    <div class="friend-item" id="friend3">
      <div class="friend-avatar-wrap">
        <img class="friend-avatar" src="https://i.pravatar.cc/150?u=user3" alt="Thu Hà">
        <span class="friend-status-dot online"></span>
      </div>
      <div class="friend-info">
        <div class="friend-name-row">
          <div class="friend-name">Thu Hà</div>
          <button class="follow-btn follow-btn-xs following" data-following="true" data-user-id="3"
                  onclick="this.classList.toggle('following');this.textContent=this.classList.contains('following')?'Đang theo dõi':'Theo dõi';">
            Đang theo dõi
          </button>
        </div>
        <div class="friend-listening">
          <div class="equalizer">
            <span class="equalizer-bar"></span>
            <span class="equalizer-bar"></span>
            <span class="equalizer-bar"></span>
          </div>
          <span class="friend-listening-track">Snowman - Sia</span>
        </div>
        <div class="friend-time">10 phút trước</div>
      </div>
    </div>

    <!-- Friend 4 - Offline -->
    <div class="friend-item" id="friend4">
      <div class="friend-avatar-wrap">
        <img class="friend-avatar" src="https://i.pravatar.cc/150?u=user4" alt="Đức Phúc">
        <span class="friend-status-dot offline"></span>
      </div>
      <div class="friend-info">
        <div class="friend-name-row">
          <div class="friend-name">Đức Phúc</div>
          <button class="follow-btn follow-btn-xs" data-following="false" data-user-id="4"
                  onclick="this.classList.toggle('following');this.textContent=this.classList.contains('following')?'Đang theo dõi':'Theo dõi';">
            Theo dõi
          </button>
        </div>
        <div class="friend-listening">
          <span class="friend-listening-track text-muted-color">Không hoạt động</span>
        </div>
        <div class="friend-time">3 giờ trước</div>
      </div>
    </div>

    <!-- Friend 5 - Online -->
    <div class="friend-item" id="friend5">
      <div class="friend-avatar-wrap">
        <img class="friend-avatar" src="https://i.pravatar.cc/150?u=user5" alt="Ngọc Trâm">
        <span class="friend-status-dot online"></span>
      </div>
      <div class="friend-info">
        <div class="friend-name-row">
          <div class="friend-name">Ngọc Trâm</div>
          <button class="follow-btn follow-btn-xs" data-following="false" data-user-id="5"

        <div class="friend-listening">
          <div class="equalizer">

    </div>

  </div>
</div>
