{% load static %}
<!-- ===== PlayMood Navbar ===== -->
<header class="app-navbar" id="appNavbar">
  <!-- Logo -->
  <a href="{% url 'home' %}" class="navbar-brand" id="navbarBrand">
    <div class="navbar-logo">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </div>
    <span class="navbar-logo-text">Play<span>Mood</span></span>
  </a>

  <!-- Search Bar -->
  <div class="navbar-search hide-mobile">
    <div class="search-bar-wrapper">
      <div class="pm-search">
        <input type="text" class="pm-search-input" id="navSearchInput" placeholder="Tìm bài hát, nghệ sĩ, playlist..." aria-label="Tìm kiếm">
        <svg class="pm-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <button class="pm-search-clear" aria-label="Xóa tìm kiếm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="search-suggestions" id="searchSuggestions"></div>
    </div>
  </div>

  <!-- Right Actions -->
  <div class="navbar-actions">
    <!-- Mobile Search Toggle -->
    <button class="navbar-action-btn show-mobile" id="mobileSearchToggle" aria-label="Tìm kiếm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>

    <!-- Notifications -->
    <button class="navbar-action-btn" id="notificationBtn" aria-label="Thông báo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      <span class="notification-dot"></span>
    </button>

    <!-- User Menu -->
    <div class="user-menu" id="userMenu">
      <div class="navbar-user" id="userMenuToggle">
        <img class="navbar-user-avatar" src="https://i.pravatar.cc/150?u=me" alt="Avatar">
        <span class="navbar-user-name hide-mobile">Thanh</span>
        <svg class="hide-mobile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="user-menu-dropdown" id="userMenuDropdown">
        <div class="user-menu-header">
          <img class="user-menu-avatar" src="https://i.pravatar.cc/150?u=me" alt="Avatar">
          <div class="user-menu-info">
            <div class="user-menu-name">Thanh</div>
            <div class="user-menu-email">thanh@playmood.vn</div>
          </div>
        </div>
        <a href="{% url 'profile' %}" class="user-menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Trang cá nhân
        </a>
        <a href="{% url 'settings' %}" class="user-menu-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Cài đặt
        </a>
        <div class="user-menu-divider"></div>
        <button class="user-menu-item danger" id="logoutBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Đăng xuất
        </button>
      </div>
    </div>
  </div>
</header>

<script>
  // User menu toggle
  document.addEventListener('DOMContentLoaded', () => {
    const toggle = document.getElementById('userMenuToggle');
    const dropdown = document.getElementById('userMenuDropdown');
    if (toggle && dropdown) {
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('active');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#userMenu')) {
          dropdown.classList.remove('active');
        }
      });
    }
  });
</script>
